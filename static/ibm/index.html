<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Edison Wong: IBM Exploratory Session">
<title>Edison Wong · IBM Exploratory Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Picture-only presentation for the IBM Exploratory Session.
   Each <section> is one "slide"; arrow keys / Space step between them.
   The title graph is drawn in JS: vertices are photos, joined by one walk in talk order. */
:root{color-scheme:dark;--bg:#0a2540;--bg2:#0f2f52;--ink:#f3f7fb;--sky:#8fd3ff;--pink:#ff5c8a;--line:rgba(143,211,255,.22)}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
@media(min-width:900px) and (min-height:620px){html{scroll-snap-type:y mandatory}}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "IBM Plex Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2{font-weight:300;letter-spacing:-.02em;line-height:1.08;margin:0}
h2{font-size:clamp(28px,3.8vw,46px);max-width:26em;margin-bottom:clamp(20px,3vh,32px)}
section{scroll-snap-align:start;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding-block:clamp(40px,6vh,72px);padding-left:max(5vw,16px,env(safe-area-inset-left,0px));padding-right:max(calc(5vw + 40px),16px,env(safe-area-inset-right,0px))}
section:nth-of-type(even){background:var(--bg2)}
.wrap{max-width:1280px;width:100%;margin:0 auto}
.ph{margin:0;border-radius:8px;overflow:hidden;background:#06192d;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.ph.logo img{object-fit:contain;padding:12%}
.ph.doc img{object-fit:contain}
/* collages: desktop uses named areas sized to one screen */
.col{display:grid;gap:14px;height:min(68svh,680px)}
.c1{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"a c c" "b c c"}
.c2{grid-template-columns:minmax(0,5fr) minmax(0,6fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"a b"}
.c3{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr);grid-template-areas:"a b c"}
.c4{grid-template-columns:minmax(0,3fr) minmax(0,6fr) minmax(0,3fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"a b b" "a c d"}
.a{grid-area:a}.b{grid-area:b}.c{grid-area:c}.d{grid-area:d}
/* title */
.hero{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.hero{grid-template-columns:minmax(0,4fr) minmax(0,7fr);align-items:center}}
.hero h1{font-size:clamp(52px,8vw,104px)}
.hero h1+p{font:400 15px "IBM Plex Mono",monospace;color:var(--sky);margin:18px 0 0}
.fig{position:relative;min-height:400px}
@media(min-width:900px){.fig{min-height:min(76svh,640px)}}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.walk{fill:none;stroke:var(--sky);stroke-width:2.5;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 3.2s .3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.end h2{font-size:clamp(44px,7vw,92px);margin:0}
/* rail */
nav.rail{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:18px}
nav.rail::before{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:1px;background:var(--line)}
nav.rail a{position:relative;display:block;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--sky);transition:transform .2s,background .2s}
nav.rail a.seen{background:var(--sky)}
nav.rail a.on{background:var(--pink);border-color:var(--pink);transform:scale(1.3)}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
@media(max-width:899px){.col{height:auto}.c1,.c2,.c3,.c4{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none;grid-template-areas:none}.col>.ph{grid-area:auto;aspect-ratio:4/3}.col>.wide{grid-column:1/-1;aspect-ratio:16/9}.col>.tall{aspect-ratio:3/4}}
@media(max-width:700px){nav.rail{display:none}section{padding-right:max(5vw,16px,env(safe-area-inset-right,0px));min-height:auto}.fig{min-height:340px}}
@media(prefers-reduced-motion:reduce){.walk{animation:none;stroke-dashoffset:0}html{scroll-behavior:auto}}
</style>
</head>
<body>

<nav class="rail" id="rail" aria-label="Sections"></nav>

<section id="top" aria-label="Title">
  <div class="wrap hero">
    <div>
      <h1>Edison Wong</h1>
      <p>IBM Exploratory Session</p>
    </div>
    <div class="fig" id="graph" role="img" aria-label="A graph whose vertices are photos of Edison's experiences, joined by one walk"></div>
  </div>
</section>

<section id="about" aria-label="Tell us about yourself">
  <div class="wrap">
    <h2>Tell us about yourself.</h2>
    <div class="col c1">
      <figure class="ph logo a"><img src="img/warwick.png" alt="University of Warwick"></figure>
      <figure class="ph logo b"><img src="img/nse.png" alt="NSE British University Esports Championship"></figure>
      <figure class="ph c wide"><img src="img/honda.jpg" alt="Honda R&amp;D Europe (UK) reception" style="object-position:50% 42%"></figure>
    </div>
  </div>
</section>

<section id="innovate" aria-label="Innovative solution">
  <div class="wrap">
    <h2>Tell us about a time you developed an innovative solution.</h2>
    <div class="col c2">
      <figure class="ph a wide"><img src="img/pitch.jpg" alt="Edison presenting 'Turning the answer into a generative question' at the ANS hackathon" style="object-position:45% 50%"></figure>
      <figure class="ph b wide"><img src="img/team.jpg" alt="Hackathon cohort at ANS" style="object-position:50% 75%"></figure>
    </div>
  </div>
</section>

<section id="customer" aria-label="Customer focus">
  <div class="wrap">
    <h2>Tell us about a time when you focused on a client or customer's needs.</h2>
    <div class="col c3">
      <figure class="ph doc a tall"><img src="img/future-stories.jpg" alt="Reading School Future Stories: Social Mobility booklet"></figure>
      <figure class="ph b tall"><img src="img/timetable-1.jpg" alt="Handwritten weekly tutoring timetable"></figure>
      <figure class="ph c tall wide"><img src="img/timetable-2.jpg" alt="Handwritten Monday timetable" style="object-position:50% 35%"></figure>
    </div>
  </div>
</section>

<section id="curious" aria-label="Curiosity about technology">
  <div class="wrap">
    <h2>Show us your curiosity about technology and explain why you would be proud to work for IBM.</h2>
    <div class="col c4">
      <figure class="ph doc a tall"><img src="img/sap.jpg" alt="SAP Spring Insight 2024 completion certificate"></figure>
      <figure class="ph b wide"><img src="img/genai.jpg" alt="Generative AI"></figure>
      <figure class="ph c"><img src="img/watsonx.jpg" alt="Agent builder in IBM watsonx Orchestrate" style="object-position:0 0"></figure>
      <figure class="ph d"><img src="img/classroom.jpg" alt="A class learning about technology"></figure>
    </div>
  </div>
</section>

<section id="end" aria-label="Thank you">
  <div class="wrap end"><h2>Thank you.</h2></div>
</section>

<script>
{
  const secs=[...document.querySelectorAll('section')];
  const rail=document.getElementById('rail');
  rail.innerHTML=secs.map(s=>`<a href="#${s.id}" aria-label="${s.getAttribute('aria-label')}"></a>`).join('');
  const dots=[...rail.children];
  let cur=0;
  const setCur=i=>{cur=i;dots.forEach((d,j)=>{d.classList.toggle('on',j===i);d.classList.toggle('seen',j<i)})};
  const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)setCur(secs.indexOf(e.target))})},{threshold:.55});
  secs.forEach(s=>io.observe(s));
  setCur(0);
  const go=i=>{i=Math.max(0,Math.min(secs.length-1,i));secs[i].scrollIntoView({behavior:'smooth'});setCur(i)};
  // Presenter keys: arrows / Space / PageUp/Down step between sections, Home/End jump.
  addEventListener('keydown',e=>{
    if(['ArrowDown','ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}
    else if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
    else if(e.key==='Home'){e.preventDefault();go(0)}
    else if(e.key==='End'){e.preventDefault();go(secs.length-1)}
  });

  // Title graph: each vertex is a photo; the walk visits them in talk order and ends on an open pink vertex.
  const V=[
    {i:'warwick.png',x:.08,y:.18,fit:'meet'},{i:'nse.png',x:.34,y:.08,fit:'meet'},{i:'honda.jpg',x:.26,y:.42},
    {i:'pitch.jpg',x:.56,y:.26},{i:'team.jpg',x:.88,y:.14},
    {i:'future-stories.jpg',x:.72,y:.54},{i:'timetable-1.jpg',x:.44,y:.66},
    {i:'sap.jpg',x:.12,y:.80},{i:'watsonx.jpg',x:.50,y:.94},{i:null,x:.88,y:.86}
  ];
  const extra=[[0,2],[1,3],[3,5],[2,6],[4,5],[6,8],[5,9],[0,7],[2,7]];
  const g=document.getElementById('graph');
  const draw=()=>{
    const W=g.clientWidth,H=g.clientHeight;
    const r=Math.max(26,Math.min(48,W/15)),m=r+6;
    const P=V.map(v=>[m+v.x*(W-2*m),m+v.y*(H-2*m)]);
    const path='M'+P.map(p=>p.map(n=>n.toFixed(1)).join(',')).join('L');
    let len=0;for(let k=1;k<P.length;k++)len+=Math.hypot(P[k][0]-P[k-1][0],P[k][1]-P[k-1][1]);
    g.innerHTML=`<svg viewBox="0 0 ${W} ${H}"><defs>${P.map((p,k)=>`<clipPath id="cp${k}"><circle cx="${p[0]}" cy="${p[1]}" r="${r}"/></clipPath>`).join('')}</defs>
      ${extra.map(([a,b])=>`<line x1="${P[a][0]}" y1="${P[a][1]}" x2="${P[b][0]}" y2="${P[b][1]}" stroke="var(--line)" stroke-width="1.2"/>`).join('')}
      <path class="walk" d="${path}" style="--len:${len.toFixed(0)}"/>
      ${P.map((p,k)=>{const v=V[k];
        if(!v.i)return `<circle cx="${p[0]}" cy="${p[1]}" r="${r*.55}" fill="var(--pink)"/><circle cx="${p[0]}" cy="${p[1]}" r="${r*.85}" fill="none" stroke="var(--pink)" stroke-width="1.5" stroke-dasharray="4 5"/>`;
        const pad=v.fit?r*.35:0;
        return `<circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="#06192d"/>
        <image href="img/${v.i}" x="${p[0]-r+pad}" y="${p[1]-r+pad}" width="${2*(r-pad)}" height="${2*(r-pad)}" preserveAspectRatio="xMidYMid ${v.fit||'slice'}" clip-path="url(#cp${k})"/>
        <circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="none" stroke="var(--sky)" stroke-width="2.5"/>`}).join('')}
    </svg>`;
  };
  const ro=new ResizeObserver(draw);ro.observe(g);
}
</script>
</body>
</html>
