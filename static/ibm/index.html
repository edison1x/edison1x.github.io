<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Edison Wong: IBM Exploratory Session">
<title>Edison Wong · IBM Exploratory Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Picture-only presentation for the IBM Exploratory Session (no text except slide titles).
   Title screen: a graph whose vertices are photos. Click any vertex to zoom into that story,
   so the talk can follow any walk through the graph; the map button (or G / Esc) returns to it.
   Each story opens as a stacked pile of photos that fans out on click / Space / arrow key;
   clicking a spread photo enlarges it. Arrow keys still step through everything in order. */
:root{color-scheme:dark;--bg:#0a2540;--bg2:#0f2f52;--ink:#f3f7fb;--sky:#8fd3ff;--pink:#ff5c8a;--line:rgba(143,211,255,.22)}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
@media(min-width:900px) and (min-height:620px){html{scroll-snap-type:y mandatory}}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "IBM Plex Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2{font-weight:300;letter-spacing:-.02em;line-height:1.08;margin:0}
h2{font-size:clamp(28px,3.8vw,46px);max-width:26em;margin-bottom:clamp(20px,3vh,32px)}
section{scroll-snap-align:start;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding-block:clamp(40px,6vh,72px);padding-left:max(5vw,16px,env(safe-area-inset-left,0px));padding-right:max(calc(5vw + 40px),16px,env(safe-area-inset-right,0px))}
section:nth-of-type(even){background:var(--bg2)}
.wrap{max-width:1280px;width:100%;margin:0 auto}
.ph{margin:0;border-radius:8px;overflow:hidden;background:#06192d;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.ph img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.ph.logo img{object-fit:contain;padding:12%}
.ph.doc img{object-fit:contain}
/* collages: desktop uses named areas sized to one screen */
.col{position:relative;display:grid;gap:14px;height:min(68svh,680px)}
.c1{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"a c c" "b c c"}
.c2{grid-template-columns:minmax(0,5fr) minmax(0,6fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"a b"}
.c3{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"a";justify-items:center}
.c3>.ph{height:100%;aspect-ratio:569/800}
.c4{grid-template-columns:minmax(0,3fr) minmax(0,6fr) minmax(0,3fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"a b b" "a c d"}
.a{grid-area:a}.b{grid-area:b}.c{grid-area:c}.d{grid-area:d}
/* stacked pile -> spread collage. --t is computed in JS from each photo's grid position. */
.col>.ph{transition:transform .75s cubic-bezier(.2,.8,.2,1) calc(var(--i,0)*70ms),box-shadow .75s,border-color .75s}
.col.stacked>.ph{transform:var(--t);box-shadow:0 18px 40px rgba(0,0,0,.5);border:6px solid #f3f7fb;cursor:pointer;transition-delay:0s}
.col.stacked{cursor:pointer}
.col.stacked>.ph:last-child{animation:nudge 2.4s 1s ease-in-out infinite}
@keyframes nudge{0%,100%{translate:0 0}50%{translate:0 -6px}}
/* title */
.hero{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.hero{grid-template-columns:minmax(0,4fr) minmax(0,7fr);align-items:center}}
.hero h1{font-size:clamp(52px,8vw,104px)}
.hero h1+p{font:400 15px "IBM Plex Mono",monospace;color:var(--sky);margin:18px 0 0}
.fig{position:relative;min-height:400px}
@media(min-width:900px){.fig{min-height:min(76svh,640px)}}
.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.walk{fill:none;stroke:var(--sky);stroke-width:2.5;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 3.2s .3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.node{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .25s}
.node:hover,.node:focus-visible{transform:scale(1.18);outline:none}
.node .ring{fill:none;stroke:var(--sky);stroke-width:2.5;transition:stroke .3s}
.node .halo{fill:none;stroke:var(--pink);stroke-width:2;opacity:0;transition:opacity .3s}
.node.seen .ring{stroke:var(--pink)}
.node.seen .halo{opacity:1}
.node:hover .ring,.node:focus-visible .ring{stroke:#fff}
.edge{stroke:var(--line);stroke-width:1.2;transition:stroke .25s,stroke-width .25s}
.edge.hot{stroke:var(--sky);stroke-width:2}
.endgrid{display:grid;gap:24px;grid-template-columns:minmax(0,1fr);align-items:center}
@media(min-width:900px){.endgrid{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}}
/* IBM-style striped lettering: horizontal bars cut through the type */
.stripe{font-weight:600;font-size:clamp(64px,10vw,150px);line-height:.95;letter-spacing:-.03em;margin:0;color:#78a9ff;background:repeating-linear-gradient(180deg,#78a9ff 0 .062em,transparent .062em .09em);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#finale{min-height:420px}
@media(min-width:900px){#finale{min-height:min(70svh,600px)}}
#finale line{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .9s cubic-bezier(.4,0,.2,1)}
#finale .spoke{stroke:var(--sky);stroke-width:1.6}
#finale .rim{stroke:var(--line);stroke-width:1.2}
#finale .pic{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.4);transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}
#finale .hub{transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .7s cubic-bezier(.3,1.6,.5,1) 1.2s}
#end.play #finale line{stroke-dashoffset:0}
#end.play #finale .pic{opacity:1;transform:none}
#end.play #finale .hub{transform:none}
#finale .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s 2s ease-out infinite;opacity:0}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.9);opacity:0}}
/* rail + map button */
nav.rail{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:18px}
nav.rail::before{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:1px;background:var(--line)}
nav.rail a{position:relative;display:block;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--sky);transition:transform .2s,background .2s}
nav.rail a.seen{background:var(--sky)}
nav.rail a.on{background:var(--pink);border-color:var(--pink);transform:scale(1.3)}
#map{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:6;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(6,25,45,.85);color:var(--sky);display:grid;place-items:center;cursor:pointer;transition:opacity .3s,transform .2s}
#map:hover{transform:scale(1.08);color:#fff}
#map[aria-hidden=true]{opacity:0;pointer-events:none}
/* zoom portal + lightbox */
.portal{position:fixed;inset:0;z-index:20;background:var(--bg) center/cover no-repeat;pointer-events:none}
#lb{position:fixed;inset:0;z-index:30;background:rgba(4,14,26,.92);display:grid;place-items:center;padding:max(4vw,16px);cursor:zoom-out}
#lb[hidden]{display:none}
#lb img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .35s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
@media(max-width:899px){.col{height:auto}.c1,.c2,.c3,.c4{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none;grid-template-areas:none}.col>.ph{grid-area:auto;aspect-ratio:4/3}.col>.wide{grid-column:1/-1;aspect-ratio:16/9}.col>.tall{aspect-ratio:3/4}}
@media(max-width:899px){.c3{grid-template-columns:minmax(0,1fr)}.c3>.ph{height:auto;width:min(100%,420px);justify-self:center}}
@media(max-width:700px){nav.rail{display:none}section{padding-right:max(5vw,16px,env(safe-area-inset-right,0px));min-height:auto}.fig{min-height:340px}}
@media(prefers-reduced-motion:reduce){#finale line,#finale .pic,#finale .hub{transition:none}#finale .pulse{animation:none}.walk{animation:none;stroke-dashoffset:0}html{scroll-behavior:auto}.col>.ph{transition:none}.col.stacked>.ph:last-child{animation:none}}
</style>
</head>
<body>

<nav class="rail" id="rail" aria-label="Sections"></nav>
<button id="map" type="button" aria-label="Back to the map" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="6" r="2.5"/><circle cx="18" cy="5" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.3 6.8 16 5.4M6.3 8.2l4.4 7.6M17 7.3l-3.8 8.6"/></svg></button>
<div id="lb" hidden><img alt=""></div>

<section id="top" aria-label="Title">
  <div class="wrap hero">
    <div>
      <h1>Edison Wong</h1>
      <p>IBM Exploratory Session</p>
    </div>
    <div class="fig" id="graph" role="group" aria-label="Map of experiences: choose a photo to open that story"></div>
  </div>
</section>

<section id="about" aria-label="Tell us about yourself">
  <div class="wrap">
    <h2>Tell us about yourself.</h2>
    <div class="col c1">
      <figure class="ph logo a"><img src="img/warwick.png" alt="University of Warwick"></figure>
      <figure class="ph logo b"><img src="img/nse.png" alt="NSE British University Esports Championship"></figure>
      <figure class="ph c wide"><img src="img/honda.jpg" alt="Honda R&amp;D Europe (UK) reception" style="object-position:50% 42%"></figure>
    </div>
  </div>
</section>

<section id="innovate" aria-label="Innovative solution">
  <div class="wrap">
    <h2>Tell us about a time you developed an innovative solution.</h2>
    <div class="col c2">
      <figure class="ph a wide"><img src="img/pitch.jpg" alt="Edison presenting 'Turning the answer into a generative question' at the ANS hackathon" style="object-position:45% 50%"></figure>
      <figure class="ph b wide"><img src="img/team.jpg" alt="Hackathon cohort at ANS" style="object-position:50% 75%"></figure>
    </div>
  </div>
</section>

<section id="customer" aria-label="Customer focus">
  <div class="wrap">
    <h2>Tell us about a time when you focused on a client or customer's needs.</h2>
    <div class="col c3">
      <figure class="ph doc a tall"><img src="img/future-stories.jpg" alt="Reading School Future Stories: Social Mobility booklet"></figure>
    </div>
  </div>
</section>

<section id="curious" aria-label="Curiosity about technology">
  <div class="wrap">
    <h2>Show us your curiosity about technology and explain why you would be proud to work for IBM.</h2>
    <div class="col c4">
      <figure class="ph doc a tall"><img src="img/sap.jpg" alt="SAP Spring Insight 2024 completion certificate"></figure>
      <figure class="ph b wide"><img src="img/genai.jpg" alt="Generative AI"></figure>
      <figure class="ph c"><img src="img/watsonx.jpg" alt="Agent builder in IBM watsonx Orchestrate" style="object-position:0 0"></figure>
      <figure class="ph d"><img src="img/classroom.jpg" alt="A class learning about technology"></figure>
    </div>
  </div>
</section>

<section id="end" aria-label="Thank you">
  <div class="wrap endgrid">
    <h2 class="stripe">Thank<br>you.</h2>
    <div class="fig" id="finale" role="img" aria-label="Every experience joined to IBM at the centre"></div>
  </div>
</section>

<script>
{
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const phone=matchMedia('(max-width:700px)');
  const secs=[...document.querySelectorAll('section')];
  const ids=secs.map(s=>s.id);
  const seen=new Set();               // stories already opened, shown as pink vertices on the map
  const rail=document.getElementById('rail');
  const mapBtn=document.getElementById('map');
  const lb=document.getElementById('lb');
  rail.innerHTML=secs.map(s=>`<a href="#${s.id}" aria-label="${s.getAttribute('aria-label')}"></a>`).join('');
  const dots=[...rail.children];
  let cur=0;

  /* ---------- section tracking ---------- */
  const setCur=i=>{
    cur=i;
    dots.forEach((d,j)=>{d.classList.toggle('on',j===i);d.classList.toggle('seen',j<i)});
    mapBtn.setAttribute('aria-hidden',i===0?'true':'false');
    // count a story as told only once it has been on screen for a moment (not when scrolled past)
    clearTimeout(setCur.t);
    if(i>0)setCur.t=setTimeout(()=>{if(cur===i){seen.add(ids[i]);markSeen()}},900);
  };
  const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)setCur(secs.indexOf(e.target))})},{threshold:.55});
  secs.forEach(s=>io.observe(s));
  const jump=(i,smooth=true)=>{i=Math.max(0,Math.min(secs.length-1,i));window.scrollTo({top:secs[i].offsetTop,behavior:smooth&&!reduce?'smooth':'instant'});setCur(i)};

  /* ---------- stacked pile -> spread collage ---------- */
  const cols=[...document.querySelectorAll('.col')];
  const ROT=[-7,5,-3,8];
  // Work out, for each photo, the transform that moves it from its grid cell onto a pile in the middle.
  const pile=col=>{
    const W=col.clientWidth,H=col.clientHeight,figs=[...col.children];
    figs.forEach((f,i)=>{
      const fx=f.offsetLeft+f.offsetWidth/2,fy=f.offsetTop+f.offsetHeight/2;
      const s=Math.min(1,W*.5/f.offsetWidth,H*.8/f.offsetHeight);
      const off=(i-(figs.length-1)/2)*22;
      f.style.setProperty('--i',i);
      f.style.setProperty('--t',`translate(${(W/2-fx+off).toFixed(1)}px,${(H/2-fy+off*.4).toFixed(1)}px) rotate(${ROT[i%4]}deg) scale(${s.toFixed(3)})`);
    });
  };
  const stackAll=()=>cols.forEach(c=>{pile(c);if(!phone.matches)c.classList.add('stacked')});
  const roCols=new ResizeObserver(es=>es.forEach(e=>pile(e.target)));
  cols.forEach(c=>roCols.observe(c));
  stackAll();
  const spread=col=>col.classList.remove('stacked');
  const colOf=i=>secs[i].querySelector('.col');

  /* ---------- lightbox ---------- */
  const openLb=img=>{lb.querySelector('img').src=img.src;lb.querySelector('img').alt=img.alt;lb.hidden=false};
  const closeLb=()=>{lb.hidden=true};
  lb.addEventListener('click',closeLb);
  cols.forEach(c=>c.addEventListener('click',e=>{
    if(c.classList.contains('stacked')){spread(c);return}
    const f=e.target.closest('.ph');if(f)openLb(f.querySelector('img'));
  }));

  /* ---------- zoom portal from a map vertex into its story ---------- */
  const portalTo=(id,x,y,r,img)=>{
    const i=ids.indexOf(id);
    if(reduce){jump(i,false);return}
    const p=document.createElement('div');p.className='portal';
    p.style.backgroundImage=img?`url(img/${img})`:'none';
    if(!img)p.style.background='var(--pink)';
    document.body.appendChild(p);
    const R=Math.hypot(innerWidth,innerHeight);
    p.animate([{clipPath:`circle(${r}px at ${x}px ${y}px)`},{clipPath:`circle(${R}px at ${x}px ${y}px)`}],{duration:650,easing:'cubic-bezier(.6,0,.2,1)',fill:'forwards'}).finished.then(()=>{
      jump(i,false);
      return p.animate([{opacity:1},{opacity:0}],{duration:450,fill:'forwards'}).finished;
    }).then(()=>p.remove());
  };
  const toMap=()=>{closeLb();jump(0)};
  mapBtn.addEventListener('click',()=>{mapBtn.blur();toMap()});

  /* ---------- title graph: vertices are photos linked to their story ---------- */
  const V=[
    {i:'warwick.png',x:.08,y:.18,fit:'meet',s:'about'},{i:'nse.png',x:.34,y:.08,fit:'meet',s:'about'},{i:'honda.jpg',x:.26,y:.42,s:'about'},
    {i:'pitch.jpg',x:.56,y:.26,s:'innovate'},{i:'team.jpg',x:.88,y:.14,s:'innovate'},
    {i:'future-stories-node.jpg',x:.72,y:.54,s:'customer'},
    {i:'sap.jpg',x:.22,y:.76,s:'curious'},{i:'watsonx.jpg',x:.50,y:.94,s:'curious'},{i:null,x:.88,y:.86,s:'end'}
  ];
  const extra=[[0,2],[1,3],[3,5],[4,5],[5,8],[0,6],[2,6],[3,7]];
  const walkE=V.slice(1).map((_,k)=>[k,k+1]);
  const g=document.getElementById('graph');
  let P=[],r=30,drawn=false;
  const label=s=>secs[ids.indexOf(s)].getAttribute('aria-label');
  const draw=()=>{
    const W=g.clientWidth,H=g.clientHeight;
    r=Math.max(26,Math.min(48,W/15));const m=r+8;
    P=V.map(v=>[m+v.x*(W-2*m),m+v.y*(H-2*m)]);
    const path='M'+P.map(p=>p.map(n=>n.toFixed(1)).join(',')).join('L');
    let len=0;for(let k=1;k<P.length;k++)len+=Math.hypot(P[k][0]-P[k-1][0],P[k][1]-P[k-1][1]);
    const line=([a,b])=>`<line class="edge" data-a="${a}" data-b="${b}" x1="${P[a][0]}" y1="${P[a][1]}" x2="${P[b][0]}" y2="${P[b][1]}"/>`;
    g.innerHTML=`<svg viewBox="0 0 ${W} ${H}"><defs>${P.map((p,k)=>`<clipPath id="cp${k}"><circle cx="${p[0]}" cy="${p[1]}" r="${r}"/></clipPath>`).join('')}</defs>
      ${extra.map(line).join('')}${walkE.map(line).join('')}
      <path class="walk" d="${path}" style="--len:${len.toFixed(0)};${drawn?'animation:none;stroke-dashoffset:0':''}"/>
      ${P.map((p,k)=>{const v=V[k];
        const body=!v.i
          ?`<circle cx="${p[0]}" cy="${p[1]}" r="${r*.55}" fill="var(--pink)"/><circle class="ring" cx="${p[0]}" cy="${p[1]}" r="${r*.85}" stroke-dasharray="4 5" style="stroke:var(--pink)"/>`
          :(()=>{const pad=v.fit?r*.35:0;return `<circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="#06192d"/>
            <image href="img/${v.i}" x="${p[0]-r+pad}" y="${p[1]-r+pad}" width="${2*(r-pad)}" height="${2*(r-pad)}" preserveAspectRatio="xMidYMid ${v.fit||'slice'}" clip-path="url(#cp${k})"/>
            <circle class="ring" cx="${p[0]}" cy="${p[1]}" r="${r}"/><circle class="halo" cx="${p[0]}" cy="${p[1]}" r="${r+6}"/>`})();
        return `<g class="node" data-k="${k}" tabindex="0" role="button" aria-label="${label(v.s)}">${body}</g>`}).join('')}
    </svg>`;
    drawn=true;markSeen();
  };
  function markSeen(){g.querySelectorAll('.node').forEach(n=>n.classList.toggle('seen',seen.has(V[+n.dataset.k].s)))}
  const hot=(k,on)=>g.querySelectorAll('.edge').forEach(e=>{if(e.dataset.a==k||e.dataset.b==k)e.classList.toggle('hot',on)});
  const activate=n=>{
    n.blur();  // so a following Space/arrow drives the story, not this vertex again
    const k=+n.dataset.k,v=V[k],box=g.getBoundingClientRect();
    portalTo(v.s,box.left+P[k][0],box.top+P[k][1],r,v.i);
  };
  g.addEventListener('click',e=>{const n=e.target.closest('.node');if(n)activate(n)});
  g.addEventListener('pointerover',e=>{const n=e.target.closest('.node');if(n)hot(n.dataset.k,true)});
  g.addEventListener('pointerout',e=>{const n=e.target.closest('.node');if(n)hot(n.dataset.k,false)});
  g.addEventListener('keydown',e=>{const n=e.target.closest('.node');if(n&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.stopPropagation();activate(n)}});
  const roG=new ResizeObserver(draw);roG.observe(g);

  /* ---------- presenter keys ----------
     Space / → / ↓ / PageDown : spread the pile if this story is still stacked, else next story
     ← / ↑ / PageUp : previous    G or Esc : back to the map    R : restack every pile    Home / End */
  addEventListener('keydown',e=>{
    if(e.defaultPrevented)return;
    if(!lb.hidden){if(['Escape',' ','Enter'].includes(e.key)){e.preventDefault();closeLb()}return}
    const k=e.key;
    if(['ArrowDown','ArrowRight','PageDown',' '].includes(k)){
      e.preventDefault();const c=cur>0&&colOf(cur);
      if(c&&c.classList.contains('stacked'))spread(c);else jump(cur+1);
    }
    else if(['ArrowUp','ArrowLeft','PageUp'].includes(k)){e.preventDefault();jump(cur-1)}
    else if(k==='Escape'||k==='g'||k==='G'){e.preventDefault();toMap()}
    else if(k==='r'||k==='R'){stackAll()}
    else if(k==='Home'){e.preventDefault();jump(0)}
    else if(k==='End'){e.preventDefault();jump(secs.length-1)}
  });

  /* ---------- finale: wheel graph, every photo joined to a central IBM-blue hub ---------- */
  const fin=document.getElementById('finale');
  const drawFinale=()=>{
    const W=fin.clientWidth,H=fin.clientHeight,pics=V.filter(v=>v.i);
    const n=pics.length,cx=W/2,cy=H/2,pr=Math.max(24,Math.min(44,W/14)),R=Math.min(W,H)/2-pr-6;
    const pts=pics.map((_,k)=>{const a=-Math.PI/2+k*2*Math.PI/n;return [cx+R*Math.cos(a),cy+R*Math.sin(a)]});
    const ln=(c,a,b,d)=>`<line class="${c}" pathLength="1" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" style="transition-delay:${d}ms"/>`;
    fin.innerHTML=`<svg viewBox="0 0 ${W} ${H}"><defs>${pts.map((p,k)=>`<clipPath id="fc${k}"><circle cx="${p[0]}" cy="${p[1]}" r="${pr}"/></clipPath>`).join('')}
      <radialGradient id="hubg"><stop offset="0" stop-color="#78a9ff"/><stop offset="1" stop-color="#0f62fe"/></radialGradient></defs>
      ${pts.map((p,k)=>ln('rim',p,pts[(k+1)%n],300+k*60)).join('')}
      ${pts.map((p,k)=>ln('spoke',p,[cx,cy],600+k*70)).join('')}
      ${pts.map((p,k)=>{const v=pics[k],pad=v.fit?pr*.35:0;return `<g class="pic" style="transition-delay:${k*70}ms"><circle cx="${p[0]}" cy="${p[1]}" r="${pr}" fill="#06192d"/>
        <image href="img/${v.i}" x="${p[0]-pr+pad}" y="${p[1]-pr+pad}" width="${2*(pr-pad)}" height="${2*(pr-pad)}" preserveAspectRatio="xMidYMid ${v.fit||'slice'}" clip-path="url(#fc${k})"/>
        <circle cx="${p[0]}" cy="${p[1]}" r="${pr}" fill="none" stroke="var(--pink)" stroke-width="2.5"/></g>`}).join('')}
      <g class="hub"><circle cx="${cx}" cy="${cy}" r="${pr*1.5}" fill="url(#hubg)"/>
      <circle class="pulse" cx="${cx}" cy="${cy}" r="${pr*1.5}" fill="none" stroke="#78a9ff" stroke-width="2"/></g>
    </svg>`;
  };
  const roF=new ResizeObserver(drawFinale);roF.observe(fin);
  // replay the finale each time the last slide comes into view
  const endSec=document.getElementById('end');
  const ioEnd=new IntersectionObserver(es=>es.forEach(e=>endSec.classList.toggle('play',e.isIntersecting)),{threshold:.5});
  ioEnd.observe(endSec);
  setCur(0);
}
</script>
</body>
</html>
